<title>Roselle</title>
<style>
:root{--primary:#D4758B;--primary-light:#E8A0BF;--primary-dark:#B85A72;--secondary:#957DAD;--accent:#F2B5A0;--bg:#FDF2F4;--surface:#fff;--surface-hover:#FFF5F7;--text-primary:#2D2D3A;--text-secondary:#6B6B80;--text-tertiary:#A0A0B0;--border:#F0E0E4;--shadow:0 2px 8px rgba(180,100,120,.08);--radius:14px;--radius-sm:10px;--nav-height:72px}

*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text-primary);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#root{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.app-content{padding-bottom:calc(var(--nav-height) + env(safe-area-inset-bottom,0px) + 8px);min-height:100dvh}

.page-loading{display:flex;align-items:center;justify-content:center;min-height:60vh}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:space-around;align-items:center;background:var(--surface);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));height:calc(var(--nav-height) + env(safe-area-inset-bottom,0px));z-index:100;backdrop-filter:blur(12px)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--text-tertiary);font-size:10px;cursor:pointer;padding:4px 12px;transition:color .2s}
.nav-item.active{color:var(--primary)}
.nav-item span{font-weight:500}
.nav-item svg{width:22px;height:22px}
.page{padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}

.page-header h1{font-size:26px;font-weight:700}
.header-date{color:var(--text-secondary);font-size:14px;margin-top:2px}
.header-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}

.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 24px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}

.btn-outline{padding:10px 16px;background:transparent;color:var(--text-primary);border:2px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-outline.active{border-color:var(--primary);color:var(--primary);background:rgba(212,117,139,.07)}
.btn-outline:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{background:none;border:none;color:var(--text-primary);cursor:pointer;padding:4px;display:flex}
.tag{display:inline-block;padding:4px 10px;background:var(--surface-hover);border-radius:20px;font-size:12px;color:var(--text-secondary);margin:2px 4px 2px 0}
.flow-tag{background:rgba(232,85,119,.13);color:#E85577}
.mood-tag{background:rgba(149,125,173,.13);color:#957DAD}
.temp-tag{background:rgba(78,173,173,.13);color:#4EADAD}
.empty-state{text-align:center;padding:40px 20px}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-state h2{font-size:22px;margin-bottom:8px}

.dashboard-grid{display:flex;gap:12px;margin-bottom:16px}
.cycle-overview{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px}

.calendar-day.fertile{background:rgba(107,184,112,.09)}
.calendar-day.ovulation{background:rgba(78,173,173,.13)}

.day-detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.day-detail-header h3{font-size:14px}
.phase-badge{display:inline-block;padding:4px 10px;border-radius:16px;font-size:12px;font-weight:500;margin-right:6px;margin-bottom:8px}
.day-detail-content{margin-top:8px}
.day-detail-content p{font-size:13px;margin-bottom:4px;color:var(--text-secondary)}
.day-symptoms{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.log-page .page-header{justify-content:space-between}
.log-section{margin-bottom:24px}
.log-section h3{font-size:15px;font-weight:600;margin-bottom:10px}
.period-actions{display:flex;gap:8px}
.flow-selector{display:flex;gap:6px;flex-wrap:wrap}
.flow-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text-secondary);transition:all .2s;flex:1;min-width:60px}

.flow-icon{font-size:18px}
.mood-selector{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mood-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:11px;color:var(--text-secondary);transition:all .2s}
.mood-btn.active{border-color:var(--secondary);color:var(--secondary);background:rgba(149,125,173,.03)}
.mood-emoji{font-size:24px}
.energy-selector{padding:8px 0}
.energy-slider{width:100%;accent-color:var(--primary)}
.energy-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-top:4px}
.energy-value{font-weight:600;color:var(--primary)}
.temp-input-wrapper{display:flex;align-items:center;gap:8px}
.temp-input{flex:1;padding:12px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-sm);font-size:18px;color:var(--text-primary);outline:none;transition:border-color .2s}
.temp-input:focus{border-color:var(--primary)}
.temp-unit{font-size:18px;color:var(--text-secondary)}
.notes-input{width:100%;padding:12px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-sm);font-size:14px;color:var(--text-primary);resize:vertical;font-family:inherit;outline:none;transition:border-color .2s}
.notes-input:focus{border-color:var(--primary)}
.save-btn{margin-top:8px;margin-bottom:24px}
.symptom-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.symptom-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .2s}
.symptom-btn.active{background:var(--surface-hover)}
.symptom-icon{font-size:20px}
.symptom-label{font-size:10px;color:var(--text-secondary);text-align:center}
.symptom-severity{font-size:9px;font-weight:600;text-transform:uppercase;min-height:13px}
.symptom-hint{grid-column:1/-1;font-size:11px;color:var(--text-tertiary);text-align:center;margin-top:4px}
.empty-chart{padding:32px 16px;text-align:center;color:var(--text-tertiary);font-size:14px}
.insights-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.stat-box{display:flex;flex-direction:column;align-items:center;padding:16px}
.stat-number{font-size:28px;font-weight:700;color:var(--primary)}
.stat-desc{font-size:12px;color:var(--text-secondary);margin-top:2px}
.symptom-bars{display:flex;flex-direction:column;gap:8px}
.symptom-bar-row{display:flex;align-items:center;gap:8px}
.symptom-bar-label{font-size:12px;width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.symptom-bar-track{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.symptom-bar-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .4s ease}
.symptom-bar-count{font-size:12px;color:var(--text-secondary);width:24px;text-align:right}
.mood-dist{display:flex;flex-direction:column;gap:8px}
.mood-dist-item{display:flex;align-items:center;gap:8px}
.mood-dist-emoji{font-size:18px}
.mood-dist-label{font-size:13px;width:60px;text-transform:capitalize}
.mood-dist-bar{flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.mood-dist-fill{height:100%;background:var(--secondary);border-radius:4px;transition:width .4s}
.mood-dist-pct{font-size:12px;color:var(--text-secondary);width:32px;text-align:right}
.cycle-history{display:flex;flex-direction:column;gap:12px}
.cycle-history-item{padding-bottom:12px;border-bottom:1px solid var(--border)}
.cycle-history-item:last-child{border-bottom:none;padding-bottom:0}
.cycle-history-dates{font-size:14px;margin-bottom:6px}
.cycle-history-stats{display:flex;gap:6px}
.account-profile{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px}
.account-avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;margin-bottom:12px}
.account-avatar-placeholder{width:72px;height:72px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);margin-bottom:12px}
.profile-info h2{font-size:20px;margin-bottom:4px}
.edit-name{width:100%}
.name-input{width:100%;padding:10px;background:var(--bg);border:2px solid var(--border);border-radius:8px;font-size:16px;color:var(--text-primary);text-align:center;outline:none;margin-bottom:8px}

.edit-actions{display:flex;justify-content:center;gap:8px}
.settings-list{padding:4px}
.settings-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px;background:none;border:none;font-size:15px;color:var(--text-primary);cursor:pointer;border-radius:8px;transition:background .15s}
.settings-item:hover{background:var(--surface-hover)}
.settings-item.danger{color:#E85577}
.account-footer{text-align:center;font-size:12px;margin-top:24px}
.login-page{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,var(--bg),#F5E6EB)}
[data-theme=dark] .login-page{background:linear-gradient(135deg,var(--bg),#2A1F2E)}
.login-content{text-align:center;max-width:360px;width:100%}
.login-logo{margin-bottom:16px}
.login-title{font-size:36px;font-weight:700;color:var(--primary);margin-bottom:4px}
.login-subtitle{font-size:16px;color:var(--text-secondary);margin-bottom:16px}
.login-description{font-size:14px;color:var(--text-secondary);line-height:1.6;margin-bottom:28px}
.login-features{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;text-align:left}
.feature{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-secondary)}
.feature span:first-child{font-size:18px}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 24px;background:var(--surface);color:var(--text-primary);border:2px solid var(--border);border-radius:var(--radius-sm);font-size:16px;font-weight:500;cursor:pointer;transition:all .2s;box-shadow:var(--shadow)}
.google-btn:hover{background:var(--surface-hover);border-color:var(--primary)}
.google-btn:disabled{opacity:.6;cursor:not-allowed}
.text-secondary{color:var(--text-secondary)}
@media(min-width:481px){#root{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
</style>
</head>

const AuthCtx=createContext({})
const useAuth=()=>useContext(AuthCtx)
function AuthProvider({children}){
  const[user,setUser]=useState(null),[profile,setProfile]=useState(null),[loading,setLoading]=useState(true)
  useEffect(()=>{supabase.auth.getSession().then(({data:{session}})=>{setUser(session?.user??null);if(session?.user)fp(session.user.id);else setLoading(false)});const{data:{subscription}}=supabase.auth.onAuthStateChange((_,session)=>{setUser(session?.user??null);if(session?.user)fp(session.user.id);else{setProfile(null);setLoading(false)}});return()=>subscription.unsubscribe()},[])

const ThemeCtx=createContext({})

function useCycles(){
  const{user}=useAuth(),[cycles,setCycles]=useState([]),[loading,setLoading]=useState(true)
  const fc=useCallback(async()=>{if(!user)return;setLoading(true);const{data}=await supabase.from('cycles').select('*').eq('user_id',user.id).order('start_date',{ascending:false});setCycles(data||[]);setLoading(false)},[user])
  useEffect(()=>{fc()},[fc])
  async function addCycle(c){const{data,error}=await supabase.from('cycles').insert({...c,user_id:user.id}).select().single();if(!error){setCycles(p=>[data,...p]);if(cycles.length>0){const prev=cycles[0],d=Math.round((new Date(c.start_date)-new Date(prev.start_date))/864e5);if(d>0){await supabase.from('cycles').update({cycle_length:d}).eq('id',prev.id);setCycles(p=>p.map(x=>x.id===prev.id?{...x,cycle_length:d}:x))}}};return{data,error}}
  async function updateCycle(id,u){const{data,error}=await supabase.from('cycles').update(u).eq('id',id).select().single();if(!error)setCycles(p=>p.map(c=>c.id===id?data:c));return{data,error}}
  return{cycles,loading,addCycle,updateCycle,refetch:fc}

function useDailyLogs(range){
  const{user}=useAuth(),[logs,setLogs]=useState([]),[loading,setLoading]=useState(true)
  const fl=useCallback(async()=>{if(!user)return;setLoading(true);let q=supabase.from('daily_logs').select('*').eq('user_id',user.id).order('date',{ascending:false});if(range?.start)q=q.gte('date',range.start);if(range?.end)q=q.lte('date',range.end);if(!range)q=q.limit(90);const{data}=await q;setLogs(data||[]);setLoading(false)},[user,range?.start,range?.end])
  useEffect(()=>{fl()},[fl])
  async function upsertLog(l){const ds=typeof l.date==='string'?l.date:format(l.date,'yyyy-MM-dd');const{data,error}=await supabase.from('daily_logs').upsert({...l,date:ds,user_id:user.id},{onConflict:'user_id,date'}).select().single();if(!error)setLogs(p=>{const i=p.findIndex(x=>x.date===ds);if(i>=0){const u=[...p];u[i]=data;return u}return[data,...p]});return{data,error}}
  function getLog(d){const ds=typeof d==='string'?d:format(d,'yyyy-MM-dd');return logs.find(l=>l.date===ds)||null}
  return{logs,loading,upsertLog,getLog,refetch:fl}
}

function calcAvg(cycles){if(!cycles?.length)return{acl:28,apd:5};const cc=cycles.filter(c=>c.cycle_length),cd=cycles.filter(c=>c.period_duration);return{acl:cc.length?Math.round(cc.reduce((s,c)=>s+c.cycle_length,0)/cc.length):28,apd:cd.length?Math.round(cd.reduce((s,c)=>s+c.period_duration,0)/cd.length):5}}
function getCycleDay(start){if(!start)return null;return differenceInDays(startOfDay(new Date()),startOfDay(typeof start==='string'?parseISO(start):start))+1}
function getPhase(day,acl=28,apd=5){if(!day||day<1)return{phase:'unknown',name:'Unknown',color:'#888'};if(day<=apd)return{phase:'menstrual',name:'Menstrual',color:'#E85577'};const od=Math.round(acl-14);if(day<=od-3)return{phase:'follicular',name:'Follicular',color:'#4EADAD'};if(day<=od+1)return{phase:'ovulation',name:'Ovulation',color:'#6BB870'};return{phase:'luteal',name:'Luteal',color:'#A06AB4'}}
function daysUntilNext(start,acl=28){if(!start)return null;return Math.max(0,differenceInDays(startOfDay(addDays(typeof start==='string'?parseISO(start):start,acl)),startOfDay(new Date())))}
function phaseForDate(date,start,acl=28,apd=5){if(!start)return null;const s=typeof start==='string'?parseISO(start):start,d=typeof date==='string'?parseISO(date):date,ds=differenceInDays(startOfDay(d),startOfDay(s));if(ds<0)return null;return getPhase((ds%acl)+1,acl,apd)}

function BottomNav(){const loc=useLocation(),nav=useNavigate();const items=[{p:'/',icon:'home',l:'Home'},{p:'/calendar',icon:'calendar',l:'Calendar'},{p:'/log',icon:'edit',l:'Log'},{p:'/insights',icon:'chart',l:'Insights'},{p:'/account',icon:'user',l:'Account'}];return h`<nav class="bottom-nav">${items.map(it=>{const a=it.p==='/'?loc.pathname===it.p:loc.pathname.startsWith(it.p);return h`<button key=${it.p} class=${'nav-item'+(a?' active':'')} onClick=${()=>nav(it.p)}><${Icon} name=${it.icon}/><span>${it.l}</span></button>`})}</nav>`}

function PhaseRing({phase,day,acl=28}){if(!phase||!day)return null;const pct=Math.min((day/acl)*100,100),circ=2*Math.PI*54,off=circ-(pct/100)*circ;return h`<div class="phase-indicator"><svg width="140" height="140" viewBox="0 0 140 140"><circle cx="70" cy="70" r="54" fill="none" stroke="var(--border)" stroke-width="8"/><circle cx="70" cy="70" r="54" fill="none" stroke=${phase.color} stroke-width="8" stroke-dasharray=${circ} stroke-dashoffset=${off} stroke-linecap="round" transform="rotate(-90 70 70)" style=${{transition:'stroke-dashoffset .6s ease'}}/></svg><div class="phase-inner"><span class="phase-day">Day ${day}</span><span class="phase-name" style=${{color:phase.color}}>${phase.name}</span></div></div>`}

function NutritionCard({phase}){const d=NUTR[phase];if(!d)return null;return h`<div class="nutrition-card"><div class="nutrition-header"><span class="nutrition-icon">${d.icon}</span><div><h3>${d.title}</h3><p class="nutrition-subtitle">${d.sub}</p></div></div><p class="nutrition-description">${d.desc}</p><div class="nutrition-categories">${d.cats.map(c=>h`<div key=${c.n} class="nutrition-category"><div class="category-header"><span>${c.i}</span><span class="category-name">${c.n}</span></div><div class="category-items">${c.items.map(it=>h`<span key=${it} class="food-tag">${it}</span>`)}</div></div>`)}</div></div>`}

function SymptomPicker({symptoms={},onChange}){return h`<div class="symptom-picker">${SYMPTOMS.map(s=>{const sv=symptoms[s.key]||'none',a=sv!=='none';return h`<button key=${s.key} class=${'symptom-btn'+(a?' active':'')} onClick=${()=>{const i=SEV.indexOf(sv);onChange({...symptoms,[s.key]:SEV[(i+1)%4]})}} style=${a?{borderColor:SEVC[sv]}:{}}><span class="symptom-icon">${s.icon}</span><span class="symptom-label">${s.label}</span><span class="symptom-severity" style=${{color:SEVC[sv]}}>${a?sv:''}</span></button>`})}<p class="symptom-hint">Tap to cycle: none → mild → moderate → severe</p></div>`}

function TempChart({logs}){if(!logs?.length)return h`<div class="empty-chart"><p>No temperature data yet.</p></div>`;const data=logs.filter(l=>l.temperature).sort((a,b)=>new Date(a.date)-new Date(b.date)).map((l,i)=>({day:i+1,temp:Number(l.temperature),label:new Date(l.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}));if(!data.length)return h`<div class="empty-chart"><p>No temperature data yet.</p></div>`;const ts=data.map(d=>d.temp),mn=Math.floor(Math.min(...ts)*2)/2-.5,mx=Math.ceil(Math.max(...ts)*2)/2+.5,av=ts.reduce((a,b)=>a+b,0)/ts.length;return h`<div style=${{margin:'-8px -8px 0'}}><${ResponsiveContainer} width="100%" height=${220}><${LineChart} data=${data} margin=${{top:10,right:10,left:-20,bottom:0}}><${CartesianGrid} strokeDasharray="3 3" stroke="var(--border)"/><${XAxis} dataKey="label" tick=${{fill:'var(--text-secondary)',fontSize:11}} interval="preserveStartEnd"/><${YAxis} domain=${[mn,mx]} tick=${{fill:'var(--text-secondary)',fontSize:11}} tickFormatter=${v=>v+'°'}/><${Tooltip} contentStyle=${{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--text-primary)'}} formatter=${v=>[v+'°F','Temp']}/><${ReferenceLine} y=${av} stroke="var(--primary)" strokeDasharray="5 5"/><${Line} type="monotone" dataKey="temp" stroke="var(--primary)" strokeWidth=${2} dot=${{fill:'var(--primary)',r:4}} activeDot=${{r:6}}/><//><//></div>`}

function Dashboard(){const{profile}=useAuth(),{cycles,loading:cl}=useCycles(),{logs}=useDailyLogs(),nav=useNavigate();const{acl,apd}=useMemo(()=>calcAvg(cycles),[cycles]);const lc=cycles[0],cd=lc?getCycleDay(lc.start_date):null,ph=cd?getPhase(cd,acl,apd):null,du=lc?daysUntilNext(lc.start_date,acl):null;const tl=logs.find(l=>l.date===format(new Date(),'yyyy-MM-dd'));const rs=useMemo(()=>{const c={};logs.slice(0,7).forEach(l=>{if(l.symptoms)Object.entries(l.symptoms).forEach(([k,v])=>{if(v&&v!=='none')c[k]=(c[k]||0)+1})});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k])=>k.replace(/_/g,' '))},[logs]);if(cl)return h`<div class="page-loading"><div class="spinner"/></div>`;return h`<div class="page dashboard-page"><header class="page-header"><div><h1>Hello${profile?.display_name?`, ${profile.display_name.split(' ')[0]}`:''}</h1><p class="header-date">${format(new Date(),'EEEE, MMMM d')}</p></div>${profile?.avatar_url&&h`<img src=${profile.avatar_url} alt="" class="header-avatar" referrerPolicy="no-referrer"/>`}</header>${!lc?h`<div class="empty-state"><div class="empty-icon">🌸</div><h2>Welcome to Roselle</h2><p>Log your first period to get started with cycle tracking, predictions, and personalized nutrition.</p><button class="btn-primary" onClick=${()=>nav('/log')}><${Icon} name="droplets" size=${18}/> Log Your Period</button></div>`:h`<><div class="dashboard-grid"><div class="cycle-overview card"><${PhaseRing} phase=${ph} day=${cd} acl=${acl}/>${du!=null&&du>0&&h`<p class="next-period">Next period in <strong>${du} day${du!==1?'s':''}</strong></p>`}${du===0&&h`<p class="next-period period-due">Period expected today</p>`}</div><div class="quick-stats"><div class="stat-card card" onClick=${()=>nav('/insights')}><${Icon} name="droplets" size=${20} style=${{color:'#E85577'}}/><div><span class="stat-value">${apd}</span><span class="stat-label">Avg. period</span></div></div><div class="stat-card card" onClick=${()=>nav('/insights')}><${Icon} name="brain" size=${20} style=${{color:'#A06AB4'}}/><div><span class="stat-value">${acl}</span><span class="stat-label">Avg. cycle</span></div></div></div></div>${tl&&h`<div class="today-summary card"><h3>Today's Log</h3><div class="today-tags">${tl.flow_intensity&&h`<span class="tag flow-tag">Flow: ${tl.flow_intensity}</span>`}${tl.mood&&tl.mood!=='neutral'&&h`<span class="tag mood-tag">Mood: ${tl.mood}</span>`}${tl.temperature&&h`<span class="tag temp-tag">${tl.temperature}°F</span>`}</div></div>`}${rs.length>0&&h`<div class="card"><h3>Recent Symptoms</h3><div class="recent-symptoms">${rs.map(s=>h`<span key=${s} class="tag">${s}</span>`)}</div></div>`}<div class="quick-actions"><button class="action-btn" onClick=${()=>nav('/log')}><${Icon} name="droplets" size=${20}/><span>Log Today</span></button><button class="action-btn" onClick=${()=>nav('/log')}><${Icon} name="therm" size=${20}/><span>Add Temp</span></button><button class="action-btn" onClick=${()=>nav('/calendar')}><${Icon} name="calendar" size=${20}/><span>Calendar</span></button></div>${ph&&h`<${NutritionCard} phase=${ph.phase}/>`}</>`}</div>`}

function CalendarPage(){const[cm,setCm]=useState(new Date()),[sel,setSel]=useState(null),{cycles}=useCycles(),nav=useNavigate();const{logs,getLog}=useDailyLogs({start:format(startOfMonth(subMonths(cm,1)),'yyyy-MM-dd'),end:format(endOfMonth(addMonths(cm,1)),'yyyy-MM-dd')});const{acl,apd}=useMemo(()=>calcAvg(cycles),[cycles]),lc=cycles[0];const days=useMemo(()=>eachDayOfInterval({start:startOfWeek(startOfMonth(cm)),end:endOfWeek(endOfMonth(cm))}),[cm]);const pds=useMemo(()=>{const s=new Set();cycles.forEach(c=>{const st=parseISO(c.start_date),en=c.end_date?parseISO(c.end_date):addDays(st,(c.period_duration||apd)-1);eachDayOfInterval({start:st,end:en}).forEach(d=>s.add(format(d,'yyyy-MM-dd')))});return s},[cycles,apd]);const fds=useMemo(()=>{const s=new Set();logs.forEach(l=>{if(l.flow_intensity)s.add(l.date)});return s},[logs]);function info(date){const ds=format(date,'yyyy-MM-dd'),ip=pds.has(ds)||fds.has(ds),log=getLog(ds),fut=date>new Date();let ph=lc?phaseForDate(date,lc.start_date,acl,apd):null,iF=false,iO=false,iPP=false;if(lc){const ls=parseISO(lc.start_date);for(let i=0;i<6;i++){const cs=addDays(ls,acl*i),od=Math.round(acl-14),fs=addDays(cs,od-5),fe=addDays(cs,od+1);if(date>=fs&&date<=fe){iF=true;if(isSameDay(date,addDays(cs,od)))iO=true}if(fut&&i>0){const pe=addDays(cs,apd-1);if(date>=cs&&date<=pe)iPP=true}}};return{ip,iPP,iF,iO,ph,log,fut}};const sl=sel?getLog(format(sel,'yyyy-MM-dd')):null,si=sel?info(sel):null;return h`<div class="page calendar-page"><header class="page-header"><h1>Calendar</h1></header><div class="calendar-nav"><button class="icon-btn" onClick=${()=>setCm(m=>subMonths(m,1))}><${Icon} name="chevL" size=${24}/></button><h2>${format(cm,'MMMM yyyy')}</h2><button class="icon-btn" onClick=${()=>setCm(m=>addMonths(m,1))}><${Icon} name="chevR" size=${24}/></button></div><div class="calendar-legend"><span class="legend-item"><span class="legend-dot period"/>Period</span><span class="legend-item"><span class="legend-dot fertile"/>Fertile</span><span class="legend-item"><span class="legend-dot ovulation"/>Ovulation</span><span class="legend-item"><span class="legend-dot predicted"/>Predicted</span></div><div class="calendar-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>h`<div key=${d} class="calendar-weekday">${d}</div>`)}${days.map(day=>{const inf=info(day),im=isSameMonth(day,cm);let cn='calendar-day';if(!im)cn+=' other-month';if(isToday(day))cn+=' today';if(sel&&isSameDay(day,sel))cn+=' selected';if(inf.ip)cn+=' period';if(inf.iPP)cn+=' predicted-period';if(inf.iF)cn+=' fertile';if(inf.iO)cn+=' ovulation';return h`<button key=${day.toISOString()} class=${cn} onClick=${()=>setSel(day)}><span class="day-number">${format(day,'d')}</span>${inf.log&&h`<span class="day-dot"/>`}</button>`})}</div>${sel&&h`<div class="day-detail card"><div class="day-detail-header"><h3>${format(sel,'EEEE, MMMM d, yyyy')}</h3><button class="btn-sm" onClick=${()=>nav('/log/'+format(sel,'yyyy-MM-dd'))}>${sl?'Edit':'Log'}</button></div>${si?.ph&&h`<span class="phase-badge" style=${{background:si.ph.color+'22',color:si.ph.color}}>${si.ph.name} Phase</span>`}${si?.iO&&h`<span class="phase-badge" style=${{background:'#6BB87022',color:'#6BB870'}}>Estimated Ovulation</span>`}${si?.iF&&!si?.iO&&h`<span class="phase-badge" style=${{background:'#6BB87022',color:'#6BB870'}}>Fertile Window</span>`}${sl&&h`<div class="day-detail-content">${sl.flow_intensity&&h`<p>Flow: <strong>${sl.flow_intensity}</strong></p>`}${sl.mood&&h`<p>Mood: <strong>${sl.mood}</strong></p>`}${sl.temperature&&h`<p>Temp: <strong>${sl.temperature}°F</strong></p>`}${sl.symptoms&&Object.entries(sl.symptoms).filter(([,v])=>v&&v!=='none').length>0&&h`<div class="day-symptoms">${Object.entries(sl.symptoms).filter(([,v])=>v&&v!=='none').map(([k,v])=>h`<span key=${k} class="tag">${k.replace(/_/g,' ')}: ${v}</span>`)}</div>`}</div>`}</div>`}</div>`}

function LogPage(){const{date:dp}=useParams(),nav=useNavigate(),ld=dp||format(new Date(),'yyyy-MM-dd'),dd=parseISO(ld);const{logs,upsertLog,getLog}=useDailyLogs(),{cycles,addCycle,updateCycle}=useCycles();const[flow,setFlow]=useState(null),[mood,setMood]=useState('neutral'),[energy,setEnergy]=useState(3),[temp,setTemp]=useState(''),[syms,setSyms]=useState({}),[notes,setNotes]=useState(''),[saving,setSaving]=useState(false),[saved,setSaved]=useState(false),[pS,setPS]=useState(false),[pE,setPE]=useState(false);useEffect(()=>{const ex=getLog(ld);if(ex){setFlow(ex.flow_intensity);setMood(ex.mood||'neutral');setEnergy(ex.energy||3);setTemp(ex.temperature?String(ex.temperature):'');setSyms(ex.symptoms||{});setNotes(ex.notes||'')}},[ld,logs]);async function save(){setSaving(true);await upsertLog({date:ld,flow_intensity:flow,mood,energy,temperature:temp?parseFloat(temp):null,symptoms:syms,notes:notes||null});if(pS)await addCycle({start_date:ld});if(pE&&cycles[0]&&!cycles[0].end_date){const dur=Math.round((new Date(ld)-new Date(cycles[0].start_date))/864e5)+1;await updateCycle(cycles[0].id,{end_date:ld,period_duration:dur})};setSaving(false);setSaved(true);setTimeout(()=>setSaved(false),2000)};return h`<div class="page log-page"><header class="page-header"><button class="icon-btn" onClick=${()=>nav(-1)}><${Icon} name="chevL" size=${24}/></button><h1>${format(dd,'MMM d, yyyy')}</h1><div style=${{width:40}}/></header><div class="log-section"><h3>Period</h3><div class="period-actions"><button class=${'btn-outline'+(pS?' active':'')} onClick=${()=>{setPS(!pS);if(!pS)setPE(false)}}>Period Started</button><button class=${'btn-outline'+(pE?' active':'')} onClick=${()=>{setPE(!pE);if(!pE)setPS(false)}} disabled=${!cycles[0]||!!cycles[0]?.end_date}>Period Ended</button></div></div><div class="log-section"><h3>Flow</h3><div class="flow-selector">${FLOWS.map(l=>h`<button key=${l.l} class=${'flow-btn'+(flow===l.v?' active':'')} onClick=${()=>setFlow(l.v)}><span class="flow-icon">${l.i}</span><span>${l.l}</span></button>`)}</div></div><div class="log-section"><h3>Mood</h3><div class="mood-selector">${MOODS.map(m=>h`<button key=${m.v} class=${'mood-btn'+(mood===m.v?' active':'')} onClick=${()=>setMood(m.v)}><span class="mood-emoji">${m.e}</span><span>${m.l}</span></button>`)}</div></div><div class="log-section"><h3>Energy Level</h3><div class="energy-selector"><input type="range" min="1" max="5" value=${energy} onInput=${ev=>setEnergy(Number(ev.target.value))} class="energy-slider"/><div class="energy-labels"><span>Low</span><span class="energy-value">${energy}/5</span><span>High</span></div></div></div><div class="log-section"><h3>Temperature (BBT)</h3><div class="temp-input-wrapper"><input type="number" step="0.1" min="95" max="100" placeholder="e.g. 97.8" value=${temp} onInput=${ev=>setTemp(ev.target.value)} class="temp-input"/><span class="temp-unit">°F</span></div></div><div class="log-section"><h3>Symptoms</h3><${SymptomPicker} symptoms=${syms} onChange=${setSyms}/></div><div class="log-section"><h3>Notes</h3><textarea placeholder="How are you feeling today?" value=${notes} onInput=${ev=>setNotes(ev.target.value)} class="notes-input" rows="3"/></div><button class=${'btn-primary save-btn'+(saved?' saved':'')} onClick=${save} disabled=${saving}>${saved?h`<${Icon} name="check" size=${18}/> Saved!`:saving?'Saving...':'Save Log'}</button></div>`}

function InsightsPage(){const{cycles}=useCycles(),{logs}=useDailyLogs();const{acl,apd}=useMemo(()=>calcAvg(cycles),[cycles]);const cls=useMemo(()=>cycles.filter(c=>c.cycle_length).map(c=>c.cycle_length),[cycles]);const vari=useMemo(()=>{if(cls.length<2)return null;const m=cls.reduce((a,b)=>a+b,0)/cls.length;return Math.round(Math.sqrt(cls.reduce((s,l)=>s+Math.pow(l-m,2),0)/cls.length)*10)/10},[cls]);const sp=useMemo(()=>{const c={};logs.forEach(l=>{if(l.symptoms)Object.entries(l.symptoms).forEach(([k,v])=>{if(v&&v!=='none'){if(!c[k])c[k]=0;c[k]++}})});return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8)},[logs]);const md=useMemo(()=>{const c={};logs.forEach(l=>{if(l.mood)c[l.mood]=(c[l.mood]||0)+1});return c},[logs]);const emo={happy:'😊',calm:'😌',neutral:'😐',sad:'😢',anxious:'😰',irritable:'😤'};return h`<div class="page insights-page"><header class="page-header"><h1>Insights</h1></header><div class="insights-stats"><div class="card stat-box"><span class="stat-number">${acl}</span><span class="stat-desc">Avg. Cycle</span></div><div class="card stat-box"><span class="stat-number">${apd}</span><span class="stat-desc">Avg. Period</span></div><div class="card stat-box"><span class="stat-number">${cycles.length}</span><span class="stat-desc">Cycles</span></div><div class="card stat-box"><span class="stat-number">${vari!=null?'±'+vari:'—'}</span><span class="stat-desc">Variability</span></div></div><div class="card"><h3>Temperature Chart</h3><${TempChart} logs=${logs}/></div>${sp.length>0&&h`<div class="card"><h3>Common Symptoms</h3><div class="symptom-bars">${sp.map(([k,ct])=>{const pct=Math.round((ct/sp[0][1])*100),si=SYMPTOMS.find(s=>s.key===k);return h`<div key=${k} class="symptom-bar-row"><span class="symptom-bar-label">${si?.icon} ${k.replace(/_/g,' ')}</span><div class="symptom-bar-track"><div class="symptom-bar-fill" style=${{width:pct+'%'}}/></div><span class="symptom-bar-count">${ct}</span></div>`})}</div></div>`}${Object.keys(md).length>0&&h`<div class="card"><h3>Mood Distribution</h3><div class="mood-dist">${Object.entries(md).sort((a,b)=>b[1]-a[1]).map(([m,c])=>{const t=Object.values(md).reduce((a,b)=>a+b,0);return h`<div key=${m} class="mood-dist-item"><span class="mood-dist-emoji">${emo[m]||'😐'}</span><span class="mood-dist-label">${m}</span><div class="mood-dist-bar"><div class="mood-dist-fill" style=${{width:(c/t*100)+'%'}}/></div><span class="mood-dist-pct">${Math.round(c/t*100)}%</span></div>`})}</div></div>`}<div class="card"><h3>Cycle History</h3>${cycles.length===0?h`<p class="text-secondary">No cycles logged yet.</p>`:h`<div class="cycle-history">${cycles.map(c=>h`<div key=${c.id} class="cycle-history-item"><div class="cycle-history-dates"><span>${format(parseISO(c.start_date),'MMM d, yyyy')}</span>${c.end_date&&h`<span> — ${format(parseISO(c.end_date),'MMM d, yyyy')}</span>`}</div><div class="cycle-history-stats">${c.cycle_length&&h`<span class="tag">${c.cycle_length}d cycle</span>`}${c.period_duration&&h`<span class="tag">${c.period_duration}d period</span>`}</div></div>`)}</div>`}</div></div>`}

function AccountPage(){const{user,profile,signOut,updateProfile}=useAuth(),{theme,toggleTheme}=useTheme(),[editing,setEditing]=useState(false),[dn,setDn]=useState(profile?.display_name||'');return h`<div class="page account-page"><header class="page-header"><h1>Account</h1></header><div class="account-profile card">${profile?.avatar_url?h`<img src=${profile.avatar_url} alt="" class="account-avatar" referrerPolicy="no-referrer"/>`:h`<div class="account-avatar-placeholder"><${Icon} name="user" size=${32}/></div>`}${editing?h`<div class="edit-name"><input type="text" value=${dn} onInput=${ev=>setDn(ev.target.value)} class="name-input"/><div class="edit-actions"><button class="btn-sm" onClick=${async()=>{await updateProfile({display_name:dn});setEditing(false)}}>Save</button><button class="btn-sm btn-ghost" onClick=${()=>setEditing(false)}>Cancel</button></div></div>`:h`<div class="profile-info"><h2>${profile?.display_name||'User'}</h2><p class="text-secondary">${user?.email}</p><button class="btn-sm btn-ghost" onClick=${()=>{setDn(profile?.display_name||'');setEditing(true)}}>Edit Name</button></div>`}</div><div class="settings-list card"><button class="settings-item" onClick=${toggleTheme}><${Icon} name=${theme==='dark'?'sun':'moon'} size=${20}/><span>${theme==='dark'?'Light Mode':'Dark Mode'}</span></button></div><div class="card"><button class="settings-item danger" onClick=${signOut}><${Icon} name="logout" size=${20}/><span>Sign Out</span></button></div><p class="account-footer text-secondary">Roselle v1.0 • Made with 🌺</p></div>`}

function App(){const{user,loading}=useAuth();if(loading)return h`<div class="loading-screen"><div class="loading-logo"><svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="var(--primary)" opacity=".2"/><path d="M24 8C24 8 32 16 32 24C32 32 24 40 24 40C24 40 16 32 16 24C16 16 24 8 24 8Z" fill="var(--primary)"/></svg></div><p>Loading...</p></div>`;const Guard=({children})=>user?children:h`<${Navigate} to="/login"/>`;return h`<div class="app-content"><${Routes}><${Route} path="/login" element=${user?h`<${Navigate} to="/"/>`:h`<${LoginPage}/>`}/><${Route} path="/" element=${h`<${Guard}><${Dashboard}/><//>`}/><${Route} path="/calendar" element=${h`<${Guard}><${CalendarPage}/><//>`}/><${Route} path="/log" element=${h`<${Guard}><${LogPage}/><//>`}/><${Route} path="/log/:date" element=${h`<${Guard}><${LogPage}/><//>`}/><${Route} path="/insights" element=${h`<${Guard}><${InsightsPage}/><//>`}/><${Route} path="/account" element=${h`<${Guard}><${AccountPage}/><//>`}/><${Route} path="*" element=${h`<${Navigate} to="/"/>`}/><//>${user&&h`<${BottomNav}/>`}</div>`}

createRoot(document.getElementById('root')).render(h`<${HashRouter}><${ThemeProvider}><${AuthProvider}><${App}/><//><//><//>`)
</script></body></html>
